name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Tests that need Postgres are gated behind DATABASE_URL and skip
      # automatically when it isn't set, so CI runs without any secrets.
      - run: pytest -q
